<!DOCTYPE html>
<html>
<head>
    <title>Ticket Booking</title>
    <style>
        body{
            background-image:url("https://plain-apac-prod-public.blob:https://chatgpt.com/45fd4b78-fd9b-4a11-9e28-8265f6fdb605/202609/29/NA3otr9KG9DGyeisZkK4/image.png");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            text-align: center;
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif ;
        }
        h1{
            text-align: center;
        }
    </style>
</head>

<body>
<h1>TICKET BOOKING</h1><br>
<label>Choose Travel Type:</label><br>
<input type="radio" name="travel" value="train">Train
<input type="radio" name="travel" value="bus">Bus
<input type="radio" name="travel" value="flight">Flight<br><br>
<label>From:</label>
<input type="text" placeholder="enter starting place"><br><br>
<label>To:</label>
<input type="text" placeholder="enter destination"><br><br>
<label>Travel date:</label>
<input type="date"><br><br>
<label>Number of passengers:</label>
<input type="number" min="1" max="30"><br><br>
<label>enter email:</label>
<input type="email" placeholder="enter email"><br><br>
<label>enter your phone number:</label>
<input type="tel" placeholder="enter phone number"><br><br>
<input type="submit" value="BOOK TICKET">
</body>
</html>
